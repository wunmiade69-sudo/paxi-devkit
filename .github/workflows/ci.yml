name: PAXI DevKit CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paxi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Install Node dependencies
        run: npm ci
      - name: Syntax and helper checks
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: CLI smoke tests
        run: |
          node bin/paxi.mjs version
          node bin/paxi.mjs help
      - name: Package dry run
        run: npm pack --dry-run
