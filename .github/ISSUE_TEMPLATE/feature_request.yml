name: Feature request
description: Suggest a safe improvement to PAXI DevKit.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command surface and user-visible result.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and platform impact
      description: Explain network access, credentials, project mutation, platform requirements, and consent boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
