name: Bug report
description: Report a reproducible PAXI DevKit problem without sharing secrets.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, tokens, private URLs, signing files, customer data, or unredacted screenshots. For security vulnerabilities, use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: PAXI version
      placeholder: "2.7.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Termux on Android ARM64, Node 22"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: Include the command with secrets and private paths removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe error output
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Attach only safe, minimal fixtures.
